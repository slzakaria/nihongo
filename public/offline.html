<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f7f2ec" />
    <title>Offline | Hanazono</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f7f2ec;
        color: #2b3a4a;
        font:
          16px/1.5 system-ui,
          sans-serif;
      }
      main {
        width: min(34rem, calc(100% - 2rem));
        padding: 2rem;
        border: 1px solid #dbe5ee;
        border-radius: 1rem;
        background: #fff;
      }
      h1 {
        margin-top: 0;
        font-size: 1.5rem;
      }
      a {
        display: inline-block;
        margin-top: 1rem;
        padding: 0.65rem 1rem;
        border-radius: 0.5rem;
        background: #14324d;
        color: #fff;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You’re offline</h1>
      <p>
        Open Offline practice to continue with phrases and kana saved on this
        device. Visit that page while connected once so its app files are
        available offline.
      </p>
      <a href="/offline-practice">Open Offline practice</a>
    </main>
  </body>
</html>
